services:
  namenode:
    image: apache/hadoop:3.4.3
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: bash -c "hdfs namenode -format && hdfs namenode"

  datanode:
    image: apache/hadoop:3.4.3
    volumes:
    - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: hdfs datanode
    depends_on:
      - namenode
    deploy:
      replicas: 3


